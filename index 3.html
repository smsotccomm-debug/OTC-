<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JANコードスキャン（ネイティブ高速版）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #fff; min-height: 100vh;
  }
  h1 { font-size: 1.05rem; text-align: center; margin: 0 0 12px; }
  .cam-wrap {
    position: relative; width: 100%; max-width: 480px; margin: 0 auto;
    border-radius: 10px; overflow: hidden; background: #000;
  }
  video { width: 100%; display: block; }
  #status { text-align: center; margin: 14px 0 4px; font-size: 0.95rem; color: #cbd5e1; white-space: pre-line; }
  #engine { text-align: center; font-size: 0.78rem; color: #64748b; margin-bottom: 10px; }
  .result-box {
    display: none; max-width: 480px; margin: 14px auto 0; background: #16a34a; color: #fff;
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .result-box.show { display: block; }
  .result-box .code { font-size: 1.6rem; font-weight: bold; margin: 6px 0 14px; letter-spacing: 1px; }
  .btn {
    display: inline-block; background: #fff; color: #0f172a; border: none; padding: 12px 20px;
    border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin: 4px;
  }
  .manual-box { max-width: 480px; margin: 20px auto 0; text-align: center; }
  .manual-box input {
    width: 70%; padding: 10px; border-radius: 8px; border: none; font-size: 1rem; text-align: center;
  }
  .manual-box button {
    padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: #fff;
    font-weight: bold; margin-left: 6px;
  }
  .not-supported {
    display: none; max-width: 480px; margin: 20px auto; background: #7c2d12; color: #fff;
    border-radius: 10px; padding: 16px; text-align: center; line-height: 1.7; font-size: 0.9rem;
  }
  .not-supported.show { display: block; }
</style>
</head>
<body>

  <h1>⚡ JANコードスキャン（ネイティブ高速版）</h1>
  <div id="engine"></div>

  <div class="cam-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <div id="status">カメラを起動しています…</div>

  <div class="not-supported" id="notSupported">
    この端末・ブラウザは、ブラウザ標準の高速バーコード認識に対応していません。<br>
    <b>Androidの最新版Chromeでの利用を推奨します。</b><br>
    下の欄からJANコードを手入力してください。
  </div>

  <div class="result-box" id="resultBox">
    <div>読み取りました</div>
    <div class="code" id="resultCode"></div>
    <button class="btn" onclick="sendBack()">元の画面に戻す</button>
    <button class="btn" onclick="copyCode()">コピーする</button>
    <button class="btn" onclick="scanAgain()">もう一度読む</button>
  </div>

  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="うまく読めない場合はここに手入力">
    <button onclick="useManual()">確定</button>
  </div>

<script>
  let stream = null;
  let detector = null;
  let scanning = false;
  let lastCode = '';

  async function start() {
    if (!('BarcodeDetector' in window)) {
      document.getElementById('camWrap').style.display = 'none';
      document.getElementById('status').innerText = '';
      document.getElementById('notSupported').classList.add('show');
      document.getElementById('engine').innerText = '判定: ブラウザ標準のネイティブ認識には非対応';
      return;
    }

    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      document.getElementById('engine').innerText = '判定: ネイティブ認識に対応 (' + formats.join(', ') + ')';
      detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    } catch (e) {
      document.getElementById('notSupported').classList.add('show');
      document.getElementById('status').innerText = '';
      document.getElementById('engine').innerText = '初期化エラー: ' + e;
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          advanced: [{ focusMode: 'continuous' }]
        }
      });
      const video = document.getElementById('video');
      video.srcObject = stream;
      document.getElementById('status').innerText = '読み取り中…（バーコードを画面に写してください）';
      scanning = true;
      requestAnimationFrame(tick);
    } catch (e) {
      document.getElementById('status').innerText = 'カメラを起動できませんでした。\n' + e;
    }
  }

  function tick() {
    if (!scanning) return;
    const video = document.getElementById('video');
    if (video.readyState >= 2) {
      detector.detect(video)
        .then(function(codes) {
          if (codes && codes.length > 0) {
            onScanned(codes[0].rawValue);
          } else {
            requestAnimationFrame(tick);
          }
        })
        .catch(function() { requestAnimationFrame(tick); });
    } else {
      requestAnimationFrame(tick);
    }
  }

  function onScanned(code) {
    scanning = false;
    lastCode = code;
    if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); }
    document.getElementById('resultCode').innerText = code;
    document.getElementById('resultBox').classList.add('show');
    document.getElementById('status').innerText = '';
  }

  function scanAgain() {
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('status').innerText = 'カメラを起動しています…';
    start();
  }

  function useManual() {
    const v = document.getElementById('manualInput').value.trim();
    if (!v) { alert('JANコードを入力してください。'); return; }
    onScanned(v);
  }

  function copyCode() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lastCode).then(function() { alert('コピーしました: ' + lastCode); });
    } else {
      alert('コード: ' + lastCode);
    }
  }

  function sendBack() {
    if (window.opener) {
      window.opener.postMessage({ type: 'jan-scanned', code: lastCode }, '*');
      document.getElementById('status').innerText = '元の画面に戻しました。このタブは閉じて構いません。';
      setTimeout(function() { window.close(); }, 600);
    } else {
      alert('元のアプリの画面が見つかりません。コピーして手動で貼り付けてください。');
    }
  }

  window.addEventListener('load', start);
</script>
</body>
</html>
